  quant-backtest-loki-data:
    name: quant-backtest-loki-data
  quant-backtest-alloy-data:
    name: quant-backtest-alloy-data

networks:
  quant-backtest-net:
    name: quant-backtest-net
    driver: bridge
  quant-backtest-l2-net:
    name: quant-backtest-l2-net
    driver: bridge
    internal: true
  quant-backtest-observability-net:
